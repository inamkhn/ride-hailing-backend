# Local development infrastructure for the ride-hailing monolith.
# Kafka is intentionally NOT included: the monolith uses an in-process event
# emitter + transactional outbox (monolith-features.md §5), not Kafka.
# Start with: docker compose up -d   (from backend/)

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine # PostgreSQL 16 + PostGIS 3.4
    container_name: rh-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ride_hailing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/10-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ride_hailing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rh-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private object storage for driver documents (S3-compatible). Dev only — real
  # deployments supply their own S3_* env. Creds match the S3 defaults in env.validation.ts.
  minio:
    image: minio/minio:latest
    container_name: rh-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the private documents bucket if it doesn't already exist.
  minio-init:
    image: minio/mc:latest
    container_name: rh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ride-hailing-documents &&
      echo 'bucket ready'"

volumes:
  postgres_data:
  redis_data:
  minio_data:
